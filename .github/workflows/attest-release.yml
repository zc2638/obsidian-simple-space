name: Attest release assets

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attest-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  attest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Initialize release context
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          import path from 'node:path';
          const manifest=JSON.parse(readFileSync('manifest.json','utf8'));
          const tag=process.env.EVENT_RELEASE_TAG||manifest.version;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag)||tag!==manifest.version) {
            throw new Error('版本标签必须为 x.y.z，且与 manifest 一致');
          }
          const directory=path.join(process.env.RUNNER_TEMP,'simple-space-release');
          appendFileSync(process.env.GITHUB_ENV,`RELEASE_TAG=${tag}\nRELEASE_DIR=${directory}\n`);
          NODE

      - name: Verify build inputs match the release tag
        run: |
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          git diff --exit-code "refs/tags/$RELEASE_TAG" HEAD -- src styles.css manifest.json package.json package-lock.json scripts/build.mjs

      - name: Install, test, and build from tagged source
        run: |
          npm ci
          npm test
          npm run build

      - name: Download published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --dir "$RELEASE_DIR" --pattern main.js --pattern manifest.json --pattern styles.css

      - name: Verify published assets match the source build
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import path from 'node:path';
          for (const name of ['main.js','manifest.json','styles.css']) {
            if (!readFileSync(name).equals(readFileSync(path.join(process.env.RELEASE_DIR,name)))) {
              throw new Error(`发布附件与标签源码构建不一致：${name}`);
            }
          }
          console.log('三个发布附件均与源码构建一致。');
          NODE

      - name: Generate build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
